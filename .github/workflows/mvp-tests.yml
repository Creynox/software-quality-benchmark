name: SQBF MVP tests

on:
  push:
    branches:
      - 'feature/**'
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and browser
        run: |
          python -m pip install -e .
          python -m playwright install chromium
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Preflight scenario
        run: python -m sqbf.cli preflight --scenario projects/ble-elva/scenarios/sts-0-45-product.json
